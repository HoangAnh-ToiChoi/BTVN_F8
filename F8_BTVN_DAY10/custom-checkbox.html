<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="./asset/css/reset.css" />
        <link rel="stylesheet" href="./asset/css/custom-checkbox.css" />
    </head>
    <body>
        <div class="wrapper">
            <div class="container">
                <form action="">
                    <div class="form-group">
                        <h1>checkbox</h1>
                        <div class="form-content">
                            <span class="label-on">On</span>
                            <label class="action-btn btn-square">
                                <input
                                    type="checkbox"
                                    class="input-square"
                                    checked
                                    hidden
                                />
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <h1>radio</h1>
                        <label class="action-btn btn-circle">
                            <input
                                type="radio"
                                class="input-circle"
                                checked
                                hidden
                            />
                        </label>
                    </div>
                    <div class="form-group">
                        <h1>switch</h1>
                        <label class="action-btn btn-round">
                            <input
                                type="checkbox"
                                class="input-round"
                                checked
                                hidden
                            />
                        </label>
                    </div>
                </form>
                <form action="">
                    <div class="form-group">
                        <div class="form-content">
                            <span class="label-off">Off</span>
                            <label class="action-btn btn-square">
                                <input
                                    type="checkbox"
                                    class="input-square"
                                    hidden
                                />
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="action-btn btn-circle">
                            <input type="radio" class="input-circle" hidden />
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="action-btn btn-round">
                            <input type="checkbox" class="input-round" hidden />
                        </label>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
