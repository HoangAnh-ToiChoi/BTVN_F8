<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tender - Swipe & Match</title>
        <!-- Google Fonts: Plus Jakarta Sans -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./asset/css/reset.css" />
        <link rel="stylesheet" href="asset/css/tender.css" />
    </head>

    <body>
        <div class="app">
            <!-- App Header -->
            <header class="app-header">
                <div class="logo">
                    <svg
                        viewBox="0 0 24 24"
                        fill="url(#flame-grad)"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M12 2C12 2 6 6.5 6 12C6 15.3137 8.68629 18 12 18C15.3137 18 18 15.3137 18 12C18 6.5 12 2 12 2Z"
                        />
                        <defs>
                            <linearGradient
                                id="flame-grad"
                                x1="6"
                                y1="2"
                                x2="18"
                                y2="18"
                                gradientUnits="userSpaceOnUse"
                            >
                                <stop stop-color="#FF6036" />
                                <stop offset="1" stop-color="#FD267D" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>tender</span>
                </div>
            </header>

            <!-- Card stack container -->
            <main class="card-area">
                <div class="card-container" id="card-container">
                    <!-- Cards will be dynamically rendered by JavaScript -->
                </div>
            </main>

            <!-- Bottom Buttons -->
            <footer class="app-buttons">
                <button
                    class="btn btn-dislike"
                    id="btn-dislike"
                    title="Swipe Left / Dislike"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <button
                    class="btn btn-superlike"
                    id="btn-superlike"
                    title="Super Like"
                >
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon
                            points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"
                        />
                    </svg>
                </button>
                <button
                    class="btn btn-like"
                    id="btn-like"
                    title="Swipe Right / Like"
                >
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                        />
                    </svg>
                </button>
            </footer>
        </div>

        <script src="./asset/js/Tender.js"></script>
    </body>
</html>
