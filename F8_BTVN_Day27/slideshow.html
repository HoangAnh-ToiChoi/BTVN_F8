<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="./asset/css/reset.css" />
        <link rel="stylesheet" href="./asset/css/slideshow.css" />
    </head>

    <body>
        <div class="container">
            <div class="slide-show">
                <div class="slide-item">
                    <img
                        src="./asset/img/img-1.png"
                        alt="anh 1"
                        class="slide-img"
                    />
                </div>
                <div class="slide-item">
                    <img
                        src="./asset/img/img-2.png"
                        alt="anh 2"
                        class="slide-img"
                    />
                </div>
                <div class="slide-item">
                    <img
                        src="./asset/img/img-3.png"
                        alt="anh 3"
                        class="slide-img"
                    />
                </div>
                <div class="slide-item">
                    <img
                        src="./asset/img/img-4.png"
                        alt="anh 4"
                        class="slide-img"
                    />
                </div>
                <div class="slide-item">
                    <img
                        src="./asset/img/img-5.png"
                        alt="anh 5"
                        class="slide-img"
                    />
                </div>
                <div class="slide-item">
                    <img
                        src="./asset/img/hình_Nền4.jpg"
                        alt="anh 6"
                        class="slide-img"
                    />
                </div>
            </div>

            <button class="btn-prev control">prev</button>

            <button class="btn-next control">next</button>

            <div class="dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
        <script src="./asset/js/slideshow.js"></script>
    </body>
</html>
